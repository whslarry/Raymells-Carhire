<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign Up - Raymells Car Hire</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        // Initialize Supabase configuration from environment
        window.NEXT_PUBLIC_SUPABASE_URL = window.NEXT_PUBLIC_SUPABASE_URL || '';
        window.NEXT_PUBLIC_SUPABASE_ANON_KEY = window.NEXT_PUBLIC_SUPABASE_ANON_KEY || '';
    </script>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <h2><i class="fas fa-car"></i> Raymells Car Hire</h2>
                </div>
                <ul class="nav-menu">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../vehicles.html">Our Fleet</a></li>
                    <li><a href="../booking.html">Book Now</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card auth-card-large">
            <h1>Create Your Account</h1>
            <form id="signup-form">
                <!-- Account Information -->
                <fieldset>
                    <legend>Account Information</legend>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required
                            placeholder="Enter your email"
                        >
                        <span class="error-message" id="email-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            placeholder="Create a strong password"
                        >
                        <span class="error-message" id="password-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="password-confirm">Confirm Password</label>
                        <input 
                            type="password" 
                            id="password-confirm" 
                            name="password-confirm" 
                            required
                            placeholder="Confirm your password"
                        >
                        <span class="error-message" id="password-confirm-error"></span>
                    </div>
                </fieldset>

                <!-- Personal Information -->
                <fieldset>
                    <legend>Personal Information</legend>
                    
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input 
                            type="text" 
                            id="full-name" 
                            name="full-name" 
                            required
                            placeholder="Enter your full name"
                        >
                        <span class="error-message" id="full-name-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            required
                            placeholder="Enter your phone number"
                        >
                        <span class="error-message" id="phone-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input 
                            type="text" 
                            id="address" 
                            name="address" 
                            required
                            placeholder="Enter your address"
                        >
                        <span class="error-message" id="address-error"></span>
                    </div>
                </fieldset>

                <!-- License Information -->
                <fieldset>
                    <legend>License Information</legend>
                    
                    <div class="form-group">
                        <label for="license-number">License Number</label>
                        <input 
                            type="text" 
                            id="license-number" 
                            name="license-number" 
                            required
                            placeholder="Enter your driver's license number"
                        >
                        <span class="error-message" id="license-number-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="license-expiry">License Expiry Date</label>
                        <input 
                            type="date" 
                            id="license-expiry" 
                            name="license-expiry" 
                            required
                        >
                        <span class="error-message" id="license-expiry-error"></span>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                
                <div id="form-error" class="error-message" style="margin-top: 1rem;"></div>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Raymells Car Hire. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="signup.js"></script>
</body>
</html>
